name: RefCard02 GHCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/m347-ref-card-02" >> $GITHUB_ENV

      - name: Build image
        run: docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t $IMAGE:latest .

      - name: Test image
        run: |
          docker run -d --name app -p 8080:80 $IMAGE:latest
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080 | grep -q 'id="root"' && docker rm -f app && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag $IMAGE:latest $IMAGE:${{ github.run_number }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.run_number }}
