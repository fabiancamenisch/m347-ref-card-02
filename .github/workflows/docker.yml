name: RefCard02 CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/m347-ref-card-02

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE:latest .

      - name: Test image
        run: |
          docker run -d --name app -p 8080:80 $IMAGE:latest
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080 | grep -q 'id="root"' && docker rm -f app && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag $IMAGE:latest $IMAGE:${{ github.run_number }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.run_number }}
